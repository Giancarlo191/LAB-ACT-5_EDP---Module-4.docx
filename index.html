<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Student Profile Controller</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <h1>Interactive Student Profile Controller</h1>
  </header>

  <main class="app-main">

    <!-- ===================== PROFILE CARD ===================== -->
    <article
      id="profileCard"
      class="profile-card active"
      data-student-id="2026-001"
      data-status="active"
    >
      <h2 id="profileName">Maria Santos</h2>
      <p id="profileProgram">BS Information Technology</p>
      <p id="profileYear">3rd Year</p>
      <p id="profileStatus">Active</p>

      <div id="detailsPanel" class="details-panel">
        <p id="studentIdDisplay">Student ID: 2026-001</p>
      </div>
    </article>

    <!-- ===================== CONTROL PANEL ===================== -->
    <section class="control-panel">
      <h2 class="control-panel__title">Control Panel</h2>

      <form id="controlForm" class="control-form">

        <div class="form-group">
          <label for="nameInput">Student Name</label>
          <input
            type="text"
            id="nameInput"
            name="nameInput"
            placeholder="Enter student name"
          />
        </div>

        <div class="form-group">
          <label for="programInput">Program</label>
          <select id="programInput" name="programInput">
            <option value="BS Information Technology">BS Information Technology</option>
            <option value="BS Computer Science">BS Computer Science</option>
            <option value="BS Information Systems">BS Information Systems</option>
          </select>
        </div>

        <div class="form-group">
          <label for="yearInput">Year Level</label>
          <select id="yearInput" name="yearInput">
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </select>
        </div>

        <div class="form-group">
          <label for="statusInput">Status</label>
          <select id="statusInput" name="statusInput">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <p id="formMessage" class="form-message" role="alert"></p>

        <div class="button-row">
          <button type="button" id="updateBtn">Update Profile</button>
          <button type="button" id="toggleDetailsBtn">Toggle Details</button>
          <button type="button" id="themeBtn">Toggle Theme</button>
          <button type="button" id="resetBtn">Reset</button>
        </div>

      </form>
    </section>

  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
